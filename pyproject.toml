[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "A retrieval evaluation harness: measures which RAG configuration actually retrieves the right documents, instead of assuming."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aphelion07" }]
keywords = ["rag", "retrieval", "evaluation", "bm25", "embeddings", "benchmark"]

dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# 3.12 rather than the 3.11 floor in requires-python: numpy's bundled stubs use
# PEP 695 `type` statements that mypy only parses under 3.12+.
python_version = "3.12"
packages = ["rag_eval"]
mypy_path = "src"
strict = true
warn_return_any = false
